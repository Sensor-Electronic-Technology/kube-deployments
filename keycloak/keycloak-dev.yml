apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secrets
  namespace: keycloak-ns
type: Opaque
stringData:
  db-password: "!23seti"
  admin-username: admin
  admin-password: admin_secure_password
---
### HEADLESS SERVICE FOR CLUSTER DISCOVERY ###
apiVersion: v1
kind: Service
metadata:
  name: keycloak-discovery
  namespace: keycloak-ns
  labels:
    app: keycloak
spec:
  clusterIP: None
  ports:
    - name: jgroups
      port: 7800
      targetPort: 7800
  selector:
    app: keycloak
---
### Clustered Keycloak Deployment ###
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak-ns
  labels:
    app: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:latest
          args: ["start", "--http-enabled=true", "--hostname-strict=false","--cache-stack=kubernetes"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 7800
              name: jgroups
          env:
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # External Postgres Configuration
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: "jdbc:postgresql://172.20.4.211:5432/app"
            - name: KC_DB_USERNAME
              value: "keycloak-user"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secrets
                  key: db-password         
            # 3. Clustering Discovery Protocols Variables
            - name: JGROUPS_DISCOVERY_PROTOCOL
              value: "DNS_PING"
            - name: KC_CACHE_STACK
              value: "kubernetes"
            # Syntax: <headless-service-name>.<namespace>.svc.cluster.local
            - name: JGROUPS_DNS_QUERY
              value: "keycloak-discovery.keycloak-ns.svc.cluster.local"
          resources:
            limits:
              cpu: 2000m
              memory: 2000Mi
            requests:
              cpu: 500m
              memory: 1700Mi
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 65
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak-ns
spec:
  loadBalancerIP: 172.20.4.212
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: keycloak