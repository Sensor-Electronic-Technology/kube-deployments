apiVersion: apps/v1
kind: Deployment
metadata:
  name: pl-map-api
  namespace: epi-system
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: pl-map-api
    spec:
      containers:
      - name: pl-map-api
        image: aelmendorf234/pl-map-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_URLS
          value: http://*:8080
        - name: TZ
          value: America/New_York
  selector:
    matchLabels:
      app: pl-map-api
---
apiVersion: v1
kind: Service
metadata:
  name: pl-map-api
  namespace: epi-system
  annotations:
    metallb.universe.tf/allow-shared-ip: "key-to-share-1.2.3.4"
spec:
  loadBalancerIP: 172.20.4.208
  type: LoadBalancer
  ports:
  - port: 31000
    targetPort: 8080
  selector:
    app: pl-map-api
