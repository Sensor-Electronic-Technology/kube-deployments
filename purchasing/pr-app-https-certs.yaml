apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-app-https-certs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pr-app-https-certs
  template:
    metadata:
      labels:
        app: pr-app-https-certs
    spec:
      # Init container to import and trust the custom root certificate
      initContainers:
      - name: import-ca
        image: mcr.microsoft.com/dotnet/aspnet:10.0
        # command: ["sh", "-c", "cp /secrets/certs/tls.crt /usr/local/share/ca-certificates/custom-root-ca.crt && update-ca-certificates"]
        command:
        - sh
        - -c
        - |
          mkdir -p /usr/local/share/ca-certificates/
          cp /secrets/certs/tls.crt /usr/local/share/ca-certificates/custom-root-ca.crt
          update-ca-certificates
        volumeMounts:
        - name: cert-volume
          mountPath: /secrets/certs
          readOnly: true
        - name: trusted-ssl-certs
          mountPath: /etc/ssl/certs
      containers:
      - name: pr-app-https-certs
        image: aelmendorf234/prapp:devhttpscerts
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DOTNET_ENVIRONMENT
          value: "Production"
          # Optimizes memory allocation for small user counts instead of massive server loads
        - name: DOTNET_gcServer
          value: "0" #Disables Server GC; uses Workstation GC which uses less memory overhead
        - name: ASPNETCORE_URLS
          value: "http://+:8080;https://+:8443"
        # 2. Point Kestrel to the certificate file mount path
        - name: Kestrel__Certificates__Default__Path
          value: "/secrets/certs/tls.crt"
        # 3. Point Kestrel to the matching private key file path
        - name: Kestrel__Certificates__Default__KeyPath
          value: "/secrets/certs/tls.key"
        volumeMounts:
        - name: cert-volume
          mountPath: "/secrets/certs"
          readOnly: true
        - name: trusted-ssl-certs
          mountPath: /etc/ssl/certs
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "2000Mi"
      volumes:
      - name: cert-volume
        secret:
          secretName: set-tls-secret
      - name: trusted-ssl-certs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pr-app-https-certs
spec:
  loadBalancerIP: 172.20.4.207
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8443
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: pr-app-https-certs
